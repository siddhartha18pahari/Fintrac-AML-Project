# FINTRAC Sentinel - AML rule definitions
#
# Rules are configuration, not code.  Each entry binds a stable rule id and a
# version to an `evaluator` implemented in app/services/rules_engine.py, plus the
# thresholds that evaluator reads.  Changing a threshold means publishing a new
# version with a new `effective_from`, so a historical case can always be
# re-derived with the parameters that were in force when it was assessed.
#
# `score.base` is the contribution to the composite risk score when the rule
# fires.  Contributions are additive and the total is capped at 100.
#
# IMPORTANT: these are AML/TF *indicators*.  An indicator is a red flag that can
# contribute to a suspicion; it is not proof that money laundering occurred, and
# no rule here decides on its own that a report must be filed.

meta:
  schema: 1
  catalogue_version: "2026.11"

rules:
  # -------------------------------------------------------------------------
  # Reporting-rule driven
  # -------------------------------------------------------------------------
  - id: AML-VC-012
    version: "1.0"
    name: 24-hour aggregated receipts reached the reporting threshold
    category: threshold
    severity: reporting
    evaluator: aggregation_threshold
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    description: >
      Two or more virtual-currency receipts related to the same conductor,
      beneficiary or third party totalled CAD 10,000 or more within a
      consecutive 24-hour window, or a single receipt reached the threshold.
      This is a reporting obligation, not by itself an indicator of suspicion.
    inputs: {}
    score:
      base: 25

  # -------------------------------------------------------------------------
  # Transaction-size behaviour
  # -------------------------------------------------------------------------
  - id: AML-VC-002
    version: "1.1"
    name: Repeated receipts accumulating just below the reporting threshold
    category: transaction_size
    severity: medium
    evaluator: near_threshold_accumulation
    dedupe: daily
    effective_from: "2026-05-01T00:00:00"
    description: >
      Several receipts aggregate to a value approaching but not reaching the
      LVCTR threshold.  Threshold proximity alone is not proof of structuring;
      it is one input within a holistic review.
    inputs:
      min_proximity: 0.85
      min_transactions: 3
    score:
      base: 18

  - id: AML-VC-004
    version: "2.0"
    name: Receipt volume far above the customer's own baseline
    category: behavioural
    severity: high
    evaluator: baseline_deviation
    dedupe: daily
    effective_from: "2026-07-01T00:00:00"
    description: >
      Value received in the last 24 hours is a large multiple of the customer's
      average *active-day* volume. v1.0 compared against an all-days average,
      which is near zero for any low-frequency customer and made ordinary
      deposits look like 30x deviations; it alerted on roughly a third of the
      book. v2.0 also requires a minimum number of active days before the
      comparator is considered meaningful.
    inputs:
      lookback_days: 90
      min_multiple: 5.0
      min_baseline_txns: 5
      min_active_days: 3
      min_window_cad: 5000
    score:
      base: 18

  - id: AML-VC-004
    version: "1.0"
    name: Receipt volume far above the customer's own baseline
    category: behavioural
    severity: high
    evaluator: baseline_deviation
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    effective_to: "2026-07-01T00:00:00"
    description: >
      Superseded by v2.0. Retained so cases assessed before 2026-07-01 remain
      reproducible with the parameters that were in force.
    inputs:
      lookback_days: 90
      min_multiple: 5.0
      min_baseline_txns: 5
      min_active_days: 0
      min_window_cad: 2000
    score:
      base: 18

  - id: AML-VC-015
    version: "1.0"
    name: Activity inconsistent with the customer's stated expected volume
    category: customer_inconsistency
    severity: medium
    evaluator: expected_volume_breach
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    description: >
      Rolling 30-day received value materially exceeds the volume the customer
      declared at onboarding for their occupation or line of business.
    inputs:
      window_days: 30
      min_multiple: 3.0
    score:
      base: 14

  - id: AML-VC-006
    version: "1.0"
    name: Dormant relationship suddenly active
    category: behavioural
    severity: medium
    evaluator: dormant_reactivation
    effective_from: "2026-01-01T00:00:00"
    inputs:
      dormant_days: 90
      min_cad: 5000
    score:
      base: 12

  # -------------------------------------------------------------------------
  # Velocity
  # -------------------------------------------------------------------------
  - id: AML-VC-001
    version: "2.1"
    name: Rapid inbound activity from multiple distinct wallets
    category: velocity
    severity: medium
    evaluator: rapid_multi_wallet_inbound
    dedupe: daily
    effective_from: "2026-06-01T00:00:00"
    description: >
      Multiple incoming virtual-currency transfers from several distinct sending
      wallets within a short period.
    inputs:
      window_minutes: 60
      min_unique_senders: 5
      min_transactions: 5
    score:
      base: 18

  - id: AML-VC-001
    version: "1.0"
    name: Rapid inbound activity from multiple distinct wallets
    category: velocity
    severity: medium
    evaluator: rapid_multi_wallet_inbound
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    effective_to: "2026-06-01T00:00:00"
    description: >
      Superseded by v2.1, which tightened the sender count from 8 to 5 after
      tuning against the Q1 alert population.  Retained so that cases assessed
      before 2026-06-01 remain reproducible.
    inputs:
      window_minutes: 60
      min_unique_senders: 8
      min_transactions: 8
    score:
      base: 15

  - id: AML-VC-003
    version: "1.0"
    name: Rapid pass-through of received virtual currency
    category: velocity
    severity: high
    evaluator: rapid_pass_through
    effective_from: "2026-01-01T00:00:00"
    description: >
      Value received is moved out again almost immediately, leaving little or no
      balance behind - consistent with the account being used as a conduit
      rather than for its stated purpose.
    inputs:
      window_minutes: 180
      min_outflow_ratio: 0.8
      min_cad: 2000
    score:
      base: 20

  - id: AML-VC-013
    version: "1.0"
    name: Rapid switching between virtual currencies (chain hopping)
    category: obfuscation
    severity: medium
    evaluator: chain_hopping
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    inputs:
      window_hours: 6
      min_distinct_assets: 3
    score:
      base: 12

  # -------------------------------------------------------------------------
  # Counterparty / network
  # -------------------------------------------------------------------------
  - id: AML-VC-005
    version: "1.2"
    name: Exposure to a high-risk counterparty wallet
    category: counterparty
    severity: high
    evaluator: high_risk_counterparty
    effective_from: "2026-03-01T00:00:00"
    description: >
      A sending or receiving counterparty address carries a high-risk
      classification from the configured blockchain-analytics source.
    inputs:
      min_external_risk: 70
      escalating_tags: [mixer, tumbler, darknet_market, sanctioned, ransomware, high_risk_exchange]
    score:
      base: 22

  - id: AML-VC-010
    version: "1.0"
    name: Fan-in - many unrelated sending wallets into one customer
    category: network
    severity: medium
    evaluator: fan_in
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    inputs:
      window_hours: 24
      min_unique_senders: 6
    score:
      base: 15

  - id: AML-VC-011
    version: "1.0"
    name: Circular movement of funds
    category: network
    severity: high
    evaluator: circular_flow
    effective_from: "2026-01-01T00:00:00"
    description: >
      Value leaves the customer and returns through one or more intermediary
      addresses, with no apparent economic purpose.
    inputs:
      window_hours: 72
      max_hops: 4
    score:
      base: 20

  - id: AML-VC-007
    version: "1.0"
    name: One wallet used by multiple customers
    category: third_party
    severity: high
    evaluator: shared_wallet
    effective_from: "2026-01-01T00:00:00"
    description: >
      The same external address transacts with more than one customer, which can
      indicate an undisclosed third party controlling the funds.
    inputs:
      lookback_days: 30
      min_customers: 2
    score:
      base: 16

  - id: AML-VC-008
    version: "1.0"
    name: Beneficiary shared across apparently unrelated customers
    category: third_party
    severity: medium
    evaluator: shared_beneficiary
    effective_from: "2026-01-01T00:00:00"
    inputs:
      lookback_days: 7
      min_customers: 2
    score:
      base: 14

  - id: AML-VC-014
    version: "1.0"
    name: Receipts concentrated in newly observed addresses
    category: obfuscation
    severity: low
    evaluator: new_address_concentration
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    inputs:
      window_hours: 24
      new_wallet_age_days: 7
      min_value_share: 0.5
      min_window_cad: 2000
    score:
      base: 10

  # -------------------------------------------------------------------------
  # Geography
  # -------------------------------------------------------------------------
  - id: AML-VC-009
    version: "1.0"
    name: Counterparty exposure to a higher-risk jurisdiction
    category: geography
    severity: medium
    evaluator: high_risk_jurisdiction
    effective_from: "2026-01-01T00:00:00"
    description: >
      Jurisdiction lists are deployment configuration.  The placeholder list
      below is illustrative only and must be replaced with the reporting
      entity's own board-approved country-risk assessment.
    inputs:
      jurisdictions: [KP, IR, MM, SY, AF]
    score:
      base: 12

  # -------------------------------------------------------------------------
  # Cash and electronic funds transfers
  #
  # These rules do not look at virtual-currency receipts. AML-FI-001 and
  # AML-FI-002 are reporting observations (LCTR / EFTR). The others are
  # suspicion indicators and never, on their own, mean a report must be filed.
  # -------------------------------------------------------------------------
  - id: AML-FI-001
    version: "1.0"
    name: Large cash receipts reached the reporting threshold
    category: threshold
    severity: reporting
    evaluator: lctr_threshold
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    description: >
      Cash received for one conductor totalled CAD 10,000 or more in a single
      receipt or across a consecutive 24-hour window. This is a Large Cash
      Transaction Report observation. It is not, by itself, a ground for suspicion.
    inputs:
      window_hours: 24
      threshold_cad: 10000
    score:
      base: 25

  - id: AML-FI-002
    version: "1.0"
    name: International electronic funds transfers reached the reporting threshold
    category: threshold
    severity: reporting
    evaluator: eftr_threshold
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    description: >
      International electronic funds transfers in one direction totalled CAD
      10,000 or more in a single transfer or across 24 hours. Domestic wires
      are out of scope. This is an EFTR observation, not an indicator of suspicion.
    inputs:
      window_hours: 24
      threshold_cad: 10000
    score:
      base: 25

  - id: AML-FI-003
    version: "1.0"
    name: Cash receipts structured below the large-cash threshold
    category: structuring
    severity: high
    evaluator: cash_structuring
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    description: >
      Three or more cash receipts each stay under CAD 10,000 and at or above
      CAD 2,000, and together reach the threshold inside 48 hours. The pattern
      is an indicator that the amount may have been broken up. It is not proof
      of structuring, and a 24-hour total that itself crosses CAD 10,000 is
      also an LCTR under AML-FI-001.
    inputs:
      window_hours: 48
      min_transactions: 3
      min_single_cad: 2000
      threshold_cad: 10000
    score:
      base: 22

  - id: AML-FI-004
    version: "1.0"
    name: Rapid movement of funds from one rail to another
    category: velocity
    severity: high
    evaluator: rapid_cross_rail
    effective_from: "2026-01-01T00:00:00"
    description: >
      Value arrives as cash or by electronic transfer and a substantial share
      leaves on a different rail — commonly virtual currency — within a few
      hours. Virtual-currency pass-through on a single rail remains AML-VC-003.
    inputs:
      window_hours: 6
      min_outflow_ratio: 0.7
      min_cad: 5000
    score:
      base: 20

  - id: AML-FI-005
    version: "1.0"
    name: Several customers place sub-threshold cash with one beneficiary
    category: structuring
    severity: high
    evaluator: multi_conductor_cash
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    description: >
      Three or more customers deliver cash below CAD 10,000 to the same
      beneficiary inside 24 hours, and the combined amount reaches the
      threshold. Each conductor may stay under the LCTR line. The pattern is
      the multi-party form of smurfing and is an indicator, not a finding of fact.
    inputs:
      window_hours: 24
      min_customers: 3
      threshold_cad: 10000
    score:
      base: 20

  # -------------------------------------------------------------------------
  # Screening against the bundled fictional list
  #
  # app/rules/screening_sample.yaml is not a sanctions, PEP, or terrorist
  # property register. A hit is a fuzzy name match for demonstration.
  # AML-TF-001 is a reporting observation in the same sense as an LCTR: it
  # records that a property report would be in question. It does not assert
  # that anyone is a listed person.
  # -------------------------------------------------------------------------
  - id: AML-SC-001
    version: "1.0"
    name: Name resembles an entry on the sample sanctions list
    category: screening
    severity: high
    evaluator: sanctions_screen
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    description: >
      The customer, a beneficiary, a third party, or a travel-rule name on the
      transaction scores at or above the similarity line against the bundled
      fictional sanctions list. Token order and small spelling differences
      still match. This is not a legal designation.
    inputs:
      min_score: 0.90
    score:
      base: 55

  - id: AML-SC-002
    version: "1.0"
    name: Name resembles an entry on the sample PEP list
    category: screening
    severity: medium
    evaluator: pep_screen
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    description: >
      A party name scores at or above the similarity line against the bundled
      fictional politically-exposed-person list. A PEP match is a reason for
      enhanced review. It is not an indication that a report must be filed.
    inputs:
      min_score: 0.90
    score:
      base: 18

  - id: AML-TF-001
    version: "1.0"
    name: Sample terrorist-property list matched a party on the transaction
    category: terrorist_property
    severity: reporting
    evaluator: terrorist_property_screen
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    description: >
      A party name matches the bundled fictional terrorist-property sample.
      On a real listed-person match, a Terrorist Property Report would have
      to be considered for property in the reporting entity's possession or
      control. This sample hit does not create that duty and is not an STR
      indicator by itself.
    inputs:
      min_score: 0.90
    score:
      base: 30

  # -------------------------------------------------------------------------
  # Travel rule and typologies
  # -------------------------------------------------------------------------
  - id: AML-TR-001
    version: "1.0"
    name: International EFT is missing travel-rule originator or beneficiary fields
    category: travel_rule
    severity: high
    evaluator: travel_rule_completeness
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    description: >
      An international electronic funds transfer at or above CAD 1,000 does
      not carry the originator and beneficiary name, account, address, and
      beneficiary institution the travel rule expects. Domestic wires are out
      of scope. A gap is a record defect. It is not, by itself, suspicion.
    inputs:
      min_cad: 1000
      required_fields:
        - originator_name
        - originator_account
        - originator_address
        - beneficiary_name
        - beneficiary_account
        - beneficiary_address
        - beneficiary_institution
    score:
      base: 40

  - id: AML-TB-001
    version: "1.0"
    name: Trade payment diverges from the declared goods value
    category: trade
    severity: high
    evaluator: trade_invoice_discrepancy
    effective_from: "2026-01-01T00:00:00"
    description: >
      A payment tagged with trade details has an invoice value that differs
      from the declared goods value by at least 25 percent, and the invoice
      is at least CAD 1,000. The pattern is the over- and under-invoicing
      form of trade-based laundering. It is an indicator, not a finding.
    inputs:
      min_invoice_cad: 1000
      min_discrepancy_ratio: 0.25
    score:
      base: 36

  - id: AML-TB-002
    version: "1.0"
    name: MSB cash-in followed by payouts to several beneficiaries
    category: typology
    severity: high
    evaluator: msb_third_party_payout
    dedupe: daily
    effective_from: "2026-01-01T00:00:00"
    description: >
      A customer whose business is money services or remittance receives at
      least CAD 5,000 in cash and, within 24 hours, pays three or more
      distinct beneficiaries on a non-cash rail. Multiple third-party payouts
      are an MSB typology indicator.
    inputs:
      window_hours: 24
      min_cash_cad: 5000
      min_beneficiaries: 3
    score:
      base: 44

  - id: AML-TB-003
    version: "1.0"
    name: Casino chips purchased and largely redeemed with minimal play
    category: typology
    severity: high
    evaluator: casino_minimal_play
    effective_from: "2026-01-01T00:00:00"
    description: >
      Chips of at least CAD 3,000 are purchased and recorded gaming activity
      is at most 20 percent of that buy-in, and the value is redeemed to a
      third party or leaves by wire or virtual currency. Minimal play is a
      casino typology indicator, not a finding that the chips laundered funds.
    inputs:
      min_chips_cad: 3000
      max_play_ratio: 0.20
    score:
      base: 44
